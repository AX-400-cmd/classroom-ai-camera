org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Project path contains non-ASCII chars (D:\...\ban), skip AGP's path check.
# AGP aborts the build unless this is set; building inside a Chinese path
# generally works on modern AGP, but if aapt2 later fails on the path,
# move the project to an ASCII-only directory instead.
android.overridePathCheck=true

# Kotlin incremental compilation writes .tab cache files that failed to
# close/lock on this machine ("Could not close incremental caches in
# ...caches-jvm\jvm\kotlin"), aborting compileReleaseKotlin. Release builds
# compile from scratch anyway, so disable IC entirely.
kotlin.incremental=false

# 资源混淆会把只在代码里以字符串引用的通知图标重命名/移除（notification icon
# 找不到 → 通知插件初始化失败 → 通知永不显示）。关掉混淆，保险起见。
android.enableResourceObfuscation=false

# Give the Kotlin daemon an explicit heap (machine has 16GB RAM); prevents
# daemon crashes that leave build files locked.
kotlin.daemon.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
